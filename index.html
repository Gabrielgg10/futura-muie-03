<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta importante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
  --sea-deep: #0a2f4d;
  --sea: #145a86;
  --sky: #f7d58a;
  --parchment: #ecd9a8;
  --parchment-dark: #d3b97c;
  --ink: #3b2412;
  --red: #c42f2a;
  --straw: #f2b632;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
  color: var(--ink);
  font-family: "IM Fell English", Georgia, serif;
  background:
    radial-gradient(circle at 80% 14%, #fff3c4 0 5%, rgba(255,243,196,0) 22%),
    linear-gradient(180deg, var(--sky) 0%, #f0a35e 38%, var(--sea) 62%, var(--sea-deep) 100%);
}

/* ondas no rodapé */
.waves {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 26vh;
  pointer-events: none;
}
.waves svg { width: 100%; height: 100%; display: block; }

.scene {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(96vw, 960px);
  gap: 8px;
}

/* ---------- cartaz de procurado ---------- */
.poster {
  position: relative;
  flex: 1 1 520px;
  max-width: 560px;
  padding: 30px 34px 34px;
  text-align: center;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,255,255,.35), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(120,70,20,.28), transparent 60%),
    var(--parchment);
  border: 3px solid var(--ink);
  border-radius: 4px;
  box-shadow:
    inset 0 0 0 7px var(--parchment),
    inset 0 0 0 9px var(--ink),
    0 24px 50px rgba(0,0,0,.45);
  transform: rotate(-1.5deg);
}

.poster h1 {
  margin: 4px 0 0;
  font-family: "Pirata One", Impact, serif;
  font-weight: 400;
  font-size: clamp(46px, 9vw, 74px);
  letter-spacing: .06em;
  line-height: 1;
}

.poster .sub {
  margin: 8px 0 18px;
  font-size: 18px;
  font-style: italic;
}

.question {
  margin: 0 auto 22px;
  padding: 16px 12px;
  border-top: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  font-size: clamp(20px, 4.6vw, 26px);
  line-height: 1.35;
}

.reward {
  margin: 0 0 24px;
  font-family: "Pirata One", Impact, serif;
  font-size: clamp(20px, 4vw, 24px);
  letter-spacing: .04em;
}

.reward strong {
  color: var(--red);
  font-weight: 400;
}

/* ---------- botões ---------- */
.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  min-height: 60px;
}

button {
  font-family: "Pirata One", Impact, serif;
  font-size: 24px;
  letter-spacing: .05em;
  padding: 10px 34px;
  border: 3px solid var(--ink);
  border-radius: 6px;
  cursor: pointer;
  color: #fff;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .12s ease, box-shadow .12s ease;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink);
}

button:focus-visible {
  outline: 3px solid var(--sea);
  outline-offset: 3px;
}

#sim { background: var(--red); }
#sim:hover { background: #d93a34; }

#nao {
  background: var(--sea);
  z-index: 10;
  transition: left .25s ease, top .25s ease, transform .12s ease;
}

#resposta {
  min-height: 52px;
  margin-top: 18px;
  font-size: 19px;
  font-style: italic;
  line-height: 1.4;
}

/* carimbo de aprovado */
.stamp {
  display: none;
  margin: 6px auto 12px;
  width: fit-content;
  padding: 6px 22px;
  font-family: "Pirata One", Impact, serif;
  font-size: clamp(38px, 9vw, 54px);
  letter-spacing: .08em;
  color: var(--red);
  border: 4px solid var(--red);
  border-radius: 6px;
  transform: rotate(-6deg);
  animation: carimbo .45s cubic-bezier(.2, 1.6, .4, 1) both;
}

.poster.aceito .stamp { display: block; }

@keyframes carimbo {
  from { opacity: 0; transform: rotate(-6deg) scale(2.4); }
  to   { opacity: .92; transform: rotate(-6deg) scale(1); }
}

/* ---------- Luffy ---------- */
.luffy-wrap {
  flex: 0 0 auto;
  width: clamp(150px, 26vw, 270px);
  margin-left: -34px;
  position: relative;
  z-index: 2;
}

.luffy {
  display: block;
  width: 100%;
  max-height: 440px;
  object-fit: contain;
  animation: flutuar 3.2s ease-in-out infinite;
  filter: drop-shadow(0 14px 18px rgba(0,0,0,.4));
}

@keyframes flutuar {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}

@media (max-width: 700px) {
  body { align-items: flex-start; padding-top: 28px; }
  .scene { flex-direction: column; gap: 0; }
  .poster { flex: none; width: 100%; padding: 24px 20px 26px; }
  .luffy-wrap { width: 130px; margin: -10px 0 0; }
  .luffy { max-height: 190px; }
}

@media (prefers-reduced-motion: reduce) {
  .luffy, .stamp { animation: none; }
  #nao { transition: none; }
}
</style>
</head>

<body>

<div class="waves" aria-hidden="true">
  <svg viewBox="0 0 1200 200" preserveAspectRatio="none">
    <path d="M0 70 Q150 20 300 70 T600 70 T900 70 T1200 70 V200 H0Z" fill="#1d6fa0" opacity=".55"/>
    <path d="M0 105 Q150 55 300 105 T600 105 T900 105 T1200 105 V200 H0Z" fill="#12507a" opacity=".8"/>
    <path d="M0 140 Q150 95 300 140 T600 140 T900 140 T1200 140 V200 H0Z" fill="#0a2f4d"/>
  </svg>
</div>

<main class="scene">

  <section class="poster" id="poster">
    <h1>PROCURA-SE</h1>
    <p class="sub">A futura mulher do capitão</p>

    <div class="stamp" aria-hidden="true">ACEITO!</div>

    <p class="question" id="pergunta">
      Você quer ser minha futura mulher e mandar em mim?
    </p>

    <p class="reward">Recompensa: <strong>todo o meu amor</strong> e carne à vontade</p>

    <div class="buttons">
      <button id="sim" type="button">Sim</button>
      <button id="nao" type="button">Não</button>
    </div>

    <div id="resposta" role="status" aria-live="polite"></div>
  </section>

  <div class="luffy-wrap">
    <img
      class="luffy"
      src="https://www.kindpng.com/picc/m/38-380559_monkey-d-luffy-luffy-one-piece-transparent-hd.png"
      alt="Monkey D. Luffy"
      onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'🏴‍☠️',style:'font-size:110px;text-align:center'}))"
    >
  </div>

</main>

<script>
const sim = document.getElementById("sim");
const nao = document.getElementById("nao");
const resposta = document.getElementById("resposta");
const poster = document.getElementById("poster");
const pergunta = document.getElementById("pergunta");

let fugas = 0;

const textos = [
  "Esse botão está amaldiçoado pela Akuma no Mi 🍈",
  "Nem o Zoro consegue clicar nele!",
  "O Luffy não aceita essa resposta! 😂",
  "Tente de novo, pirata...",
  "Resposta não encontrada no Grand Line 🧭"
];

function fugir() {
  fugas++;

  // espaço vazio para o layout não pular quando o botão sai do lugar
  nao.style.position = "fixed";

  const margem = 12;
  const maxX = Math.max(0, window.innerWidth - nao.offsetWidth - margem * 2);
  const maxY = Math.max(0, window.innerHeight - nao.offsetHeight - margem * 2);

  nao.style.left = margem + Math.random() * maxX + "px";
  nao.style.top = margem + Math.random() * maxY + "px";

  resposta.textContent = textos[fugas % textos.length];
}

nao.addEventListener("mouseenter", fugir);

nao.addEventListener("touchstart", (e) => {
  e.preventDefault();
  fugir();
}, { passive: false });

// se o "Não" for alcançado (ex.: teclado), vale como "Sim"
nao.addEventListener("click", dizerSim);
sim.addEventListener("click", dizerSim);

function dizerSim() {
  poster.classList.add("aceito");
  nao.style.display = "none";
  sim.style.display = "none";
  pergunta.textContent = "Missão cumprida, capitã!";
  resposta.innerHTML = "Sim, isso foi bem gay? 😂❤️";
}
</script>

</body>
</html>
